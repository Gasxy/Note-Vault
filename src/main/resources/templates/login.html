<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Note Vault</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 360px;
        }
        h1 {
            margin: 0 0 1.5rem 0;
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-bottom: 0.4rem;
            color: #555;
            font-weight: 600;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.6rem 0.8rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 0.7rem;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #556cd6; }
        .error {
            color: #c0392b;
            background: #fdecea;
            padding: 0.6rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            text-align: center;
        }
        .logout {
            color: #2e7d32;
            background: #e8f5e9;
            padding: 0.6rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            text-align: center;
        }
        .hint {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #777;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Note Vault</h1>

        <div th:if="${param.error}" class="error">
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="logout">
            You have been logged out.
        </div>

        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Sign In</button>
        </form>

        <div class="hint">
            Demo accounts<br>
            user / password &nbsp;&middot;&nbsp; admin / admin123
        </div>
    </div>
</body>
</html>
